<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b5cab">
  <title>Fabric Community</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/fabric-community.svg" type="image/svg+xml">

  <script>
    const communityUrl = "https://community.fabric.microsoft.com/group/ug-1791579720283-fe6a82";

    if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
      window.location.replace(communityUrl);
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
          .catch(error => console.error(error));
      });
    }
  </script>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      background: #f1f6fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .loader {
      color: #0b5cab;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="loader">Opening Microsoft Fabric Community...</div>
</body>
</html>
